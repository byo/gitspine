name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Ensure UI placeholder
        run: |
          mkdir -p internal/ui/dist
          cp internal/ui/placeholder/index.html internal/ui/dist/index.html

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: Lint TypeScript
        working-directory: web
        run: |
          npm ci
          npm run lint

  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Ensure UI placeholder
        run: |
          mkdir -p internal/ui/dist
          cp internal/ui/placeholder/index.html internal/ui/dist/index.html

      - name: go vet
        run: go vet ./...

      - name: TypeScript typecheck
        working-directory: web
        run: |
          npm ci
          npm run typecheck

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure UI placeholder
        run: |
          mkdir -p internal/ui/dist
          cp internal/ui/placeholder/index.html internal/ui/dist/index.html

      - name: Generate fixture repo
        run: bash scripts/gen-fixture-repo.sh

      - name: go test
        run: go test ./...
