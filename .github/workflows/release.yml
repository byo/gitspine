name: release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Ensure UI placeholder
        run: |
          mkdir -p internal/ui/dist
          cp internal/ui/placeholder/index.html internal/ui/dist/index.html

      - name: Generate fixture repo
        run: bash scripts/gen-fixture-repo.sh

      - name: go test
        run: go test ./...

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build
          test -f ../internal/ui/dist/index.html

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
