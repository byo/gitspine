# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gitspine

before:
  hooks:
    # Production UI must already be in internal/ui/dist (CI runs `npm run build`).
    - test -f internal/ui/dist/index.html

builds:
  - id: gitspine
    main: ./cmd/gitspine
    binary: gitspine
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
      - -X main.builtBy=goreleaser

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^Merge pull request"
      - "^Merge branch"

release:
  name_template: "v{{.Version}}"
  prerelease: auto
